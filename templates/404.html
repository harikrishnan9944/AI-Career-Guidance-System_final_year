{% extends "base.html" %}

{% block title %}404 Page Not Found - CareerPath AI{% endblock %}

{% block content %}

        <i class="bi bi-exclamation-circle text-warning fs-1 mb-3"></i>
        <h1 class="fw-extrabold text-dark mb-2">404</h1>
        <h3 class="fw-bold text-dark mb-3">Page Not Found</h3>

    </div>
</div>
{% endblock %}
